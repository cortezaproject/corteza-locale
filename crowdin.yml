project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

base_path: /src/

ignore:
  - /en/config.yaml

files:
  - source: /en/**/*
    translation: /%two_letters_code%/**/%original_file_name%
    preserve_hierarchy: true
    export_only_approved: true
    skip_untranslated_files: true
    languages_mapping:
      two_letters_code:
        pt-BR: pt-BR
        zh-TW: zh-TW
