      connection:
        label: Conexão com o banco de dados
        placeholder: Selecione uma conexão de banco de dados
        description: Alterar a conexão irá redefinir a configuração do nível de sensibilidade no módulo e nos campos, caso o nível de sensibilidade seja incompatível com a nova conexão
      ident:
        label: Nome da coleção ou tabela do banco de dados
        placeholder: compose_record
        description: "Nome da tabela ou coleção do banco de dados onde os registros podem ser acessados ​​e armazenados. Suporta marcadores de particionamento: {{module}} para identificador de módulo e {{namespace}} para identificador de namespace"
      connections:
        fetch-failed: Não foi possível obter conexões disponíveis
      module-fields:
        label: Mapeamento e codificação de campos do módulo
        description: |
          Configure como os campos de registro são armazenados e lidos do banco de dados.
          O comportamento padrão é codificar os valores em JSON e armazená-los em um único campo.
          Como alternativa, você pode usar colunas com o mesmo nome do campo (Coluna)
          ou usar um Alias ​​e armazenar o valor diretamente na coluna.
      system-fields:
        label: Mapeamento e codificação de campos do sistema
        description: |
          Os campos do sistema são usados ​​para armazenar metadados sobre o registro.
          Configure para ignorá-los ou armazená-los em uma coluna com o mesmo nome (Coluna),
          em uma coluna diferente (Alias) ou codificá-los em JSON.
        grouptypes:
          all: Todo
          partition: Partição
          userReference: Referência do usuário
          timestamps: Carimbos de data/hora
          extras: Extras
      encoding-strategy:
        unavailable: indisponível
        ident:
          placeholder: Nome do campo ou da coluna da tabela do banco de dados
        strategies:
          plain:
            label: Coluna
          alias:
            label: Alias
          json:
            label: JSON
    privacy:
      title: Privacidade
      sensitivity-level:
        label: Nível de sensibilidade máximo permitido
        placeholder: Selecione um nível de sensibilidade
        description: Nível máximo de sensibilidade permitido para os campos deste módulo. Alterar este valor redefinirá o nível de sensibilidade dos campos caso sejam incompatíveis.
      usage-disclosure:
        label: Divulgação do uso de dados sensíveis (visível no console de privacidade de dados)
      sensitivity-levels:
