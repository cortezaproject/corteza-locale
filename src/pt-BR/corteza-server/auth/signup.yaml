template:
  title: Registrar
  form:
    email:
      label: E-mail
      placeholder: email@domain.tld
    password:
      label: Senha
      placeholder: Senha
    name:
      label: Nome completo
      placeholder: Seu nome completo
    nickname:
      label: Nome, apelido ou identificador
      placeholder: Nome, apelido ou identificador
    button:
      sign-up: Enviar
  log-in: Já possui uma conta? <a data-test-id="link-login" href="{{link}}">Entrar</a>
