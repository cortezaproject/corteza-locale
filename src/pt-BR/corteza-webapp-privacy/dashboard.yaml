title: Console de privacidade de dados
connection-location: Localização da conexão
description:
  first: O Console de Privacidade de Dados permite que você acesse uma visão geral dos seus dados pessoais, solicite a exclusão ou a exportação dos seus dados.
  second: Essas ações estão sujeitas à validação pelo Controlador de Dados (CD) da sua organização
user-options:
  data-overview:
    title: Visão geral dos dados
    description: Analise as informações do seu perfil e os seus dados pessoais armazenados nas aplicações Corteza
    button-label: Veja seus dados
  privacy-requests:
    title: Solicitações de privacidade
    description: Acesse, gerencie ou exporte uma lista de todas as suas solicitações relacionadas à privacidade (exclusão, exportação, correção)
    button-label: Suas solicitações de privacidade
  export:
    title: Exportação de dados
    description: Abra uma nova solicitação de exportação de dados selecionando o tipo de dados, o intervalo de datas e o formato do arquivo de resultado
    button-label: Solicitar exportação de dados
  delete:
    title: Exclusão de dados
    description: Solicite a exclusão dos seus dados pessoais selecionados do sistema
    button-label: Solicitar exclusão de dados
dc-options:
  privacy-requests:
    title: Solicitações de privacidade
    description: Aceda, gerir ou exportar uma lista de todos os pedidos relacionados com a privacidade (exclusão, exportação, correção)
    button-label: Solicitações de privacidade recebidas
  sensitive-data:
    title: Dados sensíveis
    description: Visão geral de todos os módulos com campos de dados sensíveis
    button-label: Lista de dados sensíveis
