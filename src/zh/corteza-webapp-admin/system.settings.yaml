editor:
  title: 系統設定
  auth:
    title: 驗證
    url: 網址
    internal:
      title: 內部
      enabled: 已啟用內部驗證
      password-reset:
        enabled: 已啟用密碼重設
      password-constraints:
        title: 密碼限制
        ignored-security: 系統設定為不檢查密碼安全限制，若部署至生產環境會有安全疑慮。如果已部署至生產環境，請聯繫管理員更新系統配置 (the AUTH_PASSWORD_SECURITY .env variable)。
        min-length: 最短長度
        min-length-description: 至少須含 8 個字元
        min-num-count: 最少字元數
        min-num-count-description: 密碼須包含特定數量之字元（無法為零）
        min-special-count: 最少特殊字元數
        min-special-count-description: 密碼須包含特定數量之特殊字元（無法為零）
        min-upper-case-length: 最少大寫字元數
        min-upper-case-description: 密碼須包含特定數量之大寫字元（無法為零）
        min-lower-case-length: 最少小寫字元數
        min-lower-case-description: 密碼須包含特定數量之小寫字元（無法為零）
      signup:
        email-confirmation-required: 需完成註冊信箱驗證
        enabled: 已啟用註冊
        split-credentials-check:
          description: '將登入流程拆分為兩步驟：首先收集輸入之電子郵件，然後在第二個畫面顯示密碼輸入欄位。當使用者未設定密碼且只有一個身份識別提供者（IdP）時，自動將使用者導向外部身份識別提供者'
          label: 啟用分步驗證資訊之檢查
      profile-avatar:
        enabled: 已啟用個人頭像
      send-user-invite-email:
        title: 邀請郵件
        enabled: 建立帳號後寄送邀請郵件
        description: 啟用後，此設定會透過 CLI（命令列介面）向新建立的使用者發送一封邀請郵件
        expires:
          label: 有效期限
          description: 邀請代碼會在多久後失效
    mail:
      title: 驗證郵件之寄件人信箱
      from-address: 寄件人信箱
      from-name: 寄件人姓名
      validate-email: 請輸入有效之電子郵件信箱
    mfa:
      title: 多重要素驗證
      TOTP:
        enabled: 啟用基於時間的一次性密碼
        enforced: 所有使用者皆需使用基於時間的一次性密碼
        issuer:
          description: 使用者設定驗證時，發行者名稱將會傳送至驗證器應用程式
          label: 發行者
      emailOTP:
        enabled: 啟用透過電子郵件傳送的一次性密碼
        enforced: 所有使用者皆需使用透過電子郵件傳送的一次性密碼
        expires:
          description: 密碼會在多久後失效
          label: 有效期限
    auto-logout:
      title: 自動登出
      enabled:
        label: 已啟用
        description: 使用者閒置超過特定時間後，系統將其自動登出
      timeout:
        label: 逾時
        description: 系統自動登出使用者前之閒置秒數
  external:
    title: 外部驗證提供者
    enabled: 啟用外部驗證
    table:
      header:
        enabled: 已啟用
        provider: 提供者
        info: 發行者，客戶 ID
    standard:
      enabled: 已啟用
      apiAccess: 應用程式介面權限
      clientKey: 客戶端金鑰
      clientSecret: 密文
    oidc:
      add: 新增 OIDC 身份提供者
      enabled: 已啟用
      handle: 代號
      title: OpenID Connect
      issuer: OIDC 發行者網址
      issuerHint: 在此可見 /.well-known/openid-configuration 之網址（不含 /.well-known/openid-configuration 部分）
      clientKey: 客戶金鑰
      clientSecret: 密文
      scope: 授權範圍
      scopePlaceholder: 列出支援的授權範圍
      scopeHint: 請使用空格分隔字串
    saml:
      enabled: 已啟用
      title: SAML 
      requests:
        title: 請求設定
        sign-requests: 簽署請求
        sign-method: 簽署方式
        binding: 綁定
        binding-redirect: HTTP 重新導向
        binding-post: HTTP POST
      cert:
        public: 公開金鑰
        private: 私密金鑰
      name: 名稱
      certificate: 憑證
      idp:
        title: 身分提供者
        ident-handle: 代號欄位
        ident-identifier: 識別碼欄位
        ident-name: 名稱欄位
        url: 網址
      desc:
        name: 登入畫面顯示之身份提供者名稱 （以 <name> 登入）
        cert:
          public: 內容將以最小化顯示
          private: 內容將以最小化顯示
        requests:
          sign-requests: 簽署身分驗證請求與聲明
          sign-method: 用於簽署請求的簽署方法
          binding: 身份驗證請求所使用的 HTTP 綁定方式，預設為 HTTP 重新導向（GET）
        idp:
          url: 身分提供者中繼資料之存放位置
          ident-handle: 於 Corteza 使用者代號或暱稱上填寫之身分提供者名稱
          ident-identifier: 於 Corteza 使用者電子郵件上填寫之身分提供者名稱
          ident-name: 於 Corteza 使用者全名上填寫之身分提供者名稱
    security:
      title: 安全設定
      prohibited-roles:
        description: 當使用者透過此提供者進行身分驗證時，系統將會移除清單中指定的角色權限
        label: 禁用角色
      forced-roles:
        description: 當使用者透過此提供者進行身分驗證時，系統將會增添清單中指定的角色權限
        label: 強制角色
      permitted-roles:
        description: 當使用者透過此提供者進行身分驗證時，系統僅會增添清單中指定的角色權限
        label: 允許角色
  bgScreen:
    title: 驗證背景畫面
    image:
      uploader:
        label: 背景圖片
      editor:
        label: 自訂 CSS
