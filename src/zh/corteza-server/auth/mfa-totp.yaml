template:
  title: 配置使用 TOTP 的双因素身份验证
  enforced: |
    Corteza 管理员强制执行 TOTP 多因素身份验证。
    请立即配置。
  instructions: |
    Corteza 使用基于时间的一次性密码 (TOTP) 作为双因素身份验证的底层技术之一。请使用下方列出的应用之一，输入密码或扫描二维码。
    <br />
    <br />
    这将为您的账户提供额外的安全保障。
    <br />
    <br />
    您可以使用以下应用之一：
  lastpass: <a target="_blank" href="{{ link }}">LastPass Authenticator</a>
  gauth: 适用于 <a target="_blank" href="{{ android }}">Android</a> 或 <a target="_blank" href="{{ iphone }}">iPhone</a> 的 Google 身份验证器
  authy: <a target="_blank" href="{{ link }}">Authy</a>
  form:
    title: "请输入身份验证器应用中的代码以完成配置："
    button: 提交
alerts:
  text-MFA-enabled: 已启用 TOTP 的双因素身份验证
  text-MFA-disabled: 已停用 TOTP 的双因素身份验证
errors:
  invalid-code-format: "无效的代码格式"
  invalid-code: "无效的验证码"
