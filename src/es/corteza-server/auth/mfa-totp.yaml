template:
  title: Configurar autenticación de doble factor con TOTP
  enforced: |
    La autenticación multi factor TOTP está impuesta por el administrador de Corteza.
  instructions: |
    Corteza utiliza contraseñas de un solo uso basadas en el tiempo (TOTP) como una de las tecnologías subyacentes para autenticación de doble factor. Utiliza una de las aplicaciones listadas abajo y escribe el secreto o escanea el código QR.
    <br />
    <br />
    Esto habilitará seguridad adicional para tu cuenta.
    <br />
    <br />
    Puedes usar una de las siguientes aplicaciones:
  lastpass: <a target="_blank" href="{{ link }}">LastPass Authenticator</a>
  gauth: Google Authenticator para <a target="_blank" href="{{ android }}">Android</a> o <a target="_blank" href="{{ iphone }}">iPhone</a>
  authy: <a target="_blank" href="{{ link }}">Authy</a>
  form:
    title: "Completa la configuración introduciendo el código de la aplicación de autenticación:"
    button: Enviar
alerts:
  text-MFA-enabled: Autenticación de doble factor con TOTP habilitada
  text-MFA-disabled: Autenticación de doble factor con TOTP deshabilitada
