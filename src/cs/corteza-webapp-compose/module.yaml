          Nastavte, jak se v databázi ukládají a čtou pole záznamu.
          Výchozí chování je kódovat hodnoty do JSON a ukládat je v jednom společném poli.
          Alternativně lze použít sloupce se stejným názvem jako je název pole (Sloupec)
          nebo použít Alias a uložit hodnotu přímo do sloupce.
      system-fields:
        label: Mapování a kódování systémového pole
        description: |
          Systémová pole se používají pro ukládání metadat o záznamu. Nastavte jejich vynechání nebo ukládání do sloupce se stejným názvem (Sloupec),
          jiného sloupce (Alias), nebo kódování do JSON.
