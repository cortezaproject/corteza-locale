template:
  title: اعداد التحقق الثنائي
  enforced: |
    التحقق الثنائي اجباري من مدير النظام.
    يرجى اعداده الان.
  instructions: |
    تستخدم كورتيزا كلمات مرور لمرة واحدة قائمة على الوقت كأحد التقنيات الأساسية للمصادقة الثنائية. استخدم أحد التطبيقات المدرجة أدناه واكتب السر أو امسح رمز الاستجابة السريعة ضوئيًا.
    <br />
    <br />
    سيؤدي هذا إلى تمكين أمان إضافي لحسابك.<br />
    <br />
    يمكنك استخدام أحد التطبيقات التالية:
  lastpass: <a target="_blank" href="{{ link }}">LastPass تحقق</a>
  gauth: تحقق قوقل <a target="_blank" href="{{ android }}">أندرويد</a> or <a target="_blank" href="{{ iphone }}">آيفون</a>
  authy: <a target="_blank" href="{{ link }}">أوثي</a>
  form:
    title: "أكمل الاعداد عن طريق إدخال رمز من تطبيق المصادقة:"
    button: إرسال
alerts:
  text-MFA-enabled: التحقق الثنائي بكلمة مرور مؤقته مفعل
  text-MFA-disabled: التحقق الثنائي بكلمة مرور مؤقته معطل
