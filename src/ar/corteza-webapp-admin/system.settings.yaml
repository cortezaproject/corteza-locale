        enabled: تمكين التسجيل
        split-credentials-check:
          description: 'قم بتقسيم تسجيل الدخول إلى خطوتين: جمع إدخال البريد الإلكتروني أولاً وإظهار إدخال كلمة المرور على الشاشة الثانية. قم بإعادة توجيه المستخدم تلقائيًا إلى موفر هوية خارجي عندما لا يتم تعيين كلمة مرور المستخدم الخاصة به ولا يوجد سوى IdP واحد موجود'
          label: Enable split-credentials check
      send-user-invite-email:
