editor:
  title: اعدادات النظام
  auth:
    title: المصادقة
    url: URL
    internal:
      title: داخلي
      enabled: تم تفعيل المصادقة الداخلية
      password-reset:
        enabled: تم تفعيل إعادة تعيين كلمة المرور
      password-constraints:
