        ignored-security: تم تكوين النظام لتجاهل قيود أمان كلمات المرور غير الآمنة في عمليات نشر الإنتاج. إذا كان هذا نشر إنتاج ، فالرجاء الاتصال بالمسؤول لتحديث تكوين النظام (متغير AUTH_PASSWORD_SECURITY .env).
        min-length: الطول الأدنى
        min-length-description: يجب ألا يقل عن 8 أحرف
        min-special-count: الحد الأدنى لعدد الأحرف الخاصة
        min-special-count-description: يجب أن تتضمن كلمة المرور العدد المحدد من الأحرف الخاصة (معطل إذا تم ضبطه على 0)
