template:
  title: Настройте двухфакторную аутентификацию с помощью TOTP
  enforced: |
    Многофакторная аутентификация TOTP осуществляется администратором.
    Пожалуйста, настройте его прямо сейчас.
  instructions: |
    Используются одноразовые пароли на основе времени (TOTP) в качестве одной из базовых технологий двухфакторной аутентификации. Используйте одно из перечисленных ниже приложений и введите секретный код или отсканируйте QR-код.
    <br />
    <br />
    Это обеспечит доболнительный уровень безопасности
    <br />
    <br />
    Используйте одного из следующих поставщиков:
  lastpass: <a target="_blank" href="{{ link }}">LastPass Аутентификация</a>
  gauth: Google Authenticator для <a target="_blank" href="{{ android }}">Android</a> или <a target="_blank" href="{{ iphone }}">iPhone</a>
  authy: <a target="_blank" href="{{ link }}">Authy</a>
  form:
    title: "Завершите настройку, введя код из поставщика аутентификатора:"
    button: Применить
alerts:
  text-MFA-enabled: "43 / 5 000\nДвухфакторная аутентификация с  TOTP включена"
  text-MFA-disabled: Двухфакторная аутентификация с  TOTP отключена
