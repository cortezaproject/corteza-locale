    trimLeft: Удаляет символы с начала строки
    trimRight: Удаляет символы из конца строки
example-description: Ниже приведены несколько примеров различных вариантов использования выражений полей.
examples: Пример
field: Выражения для поля
formatCategories:
  dateTime:
    A: Возвращает полное национальное имя дня недели
    B: Возвращает полное национальное имя месяца
    C: Returns year / 100 as a decimal number; single digits are preceded by a zero
    D: Эквивалент %m/%d/%y
    F: Эквивалент %Y-%m-%d
    H: Возвращает час (24-часовые часы) как десятичное число (00-23)
    I: Возвращает час (12-часовые часы) как десятичное число (01-12)
    M: Возвращает минуту как десятичное число (00-59)
    R: Эквивалент %H:%M
    S-middle: Возвращает милисекунду как десятичное число (000-999)
    S-second: Возвращает секунду как десятичное число (00-60)
    T: Эквивалент %H:%M:%S
    U: Возвращает номер недели года (воскресенье - первый день недели) как десятичное число (00-53)
    V: Возвращает номер недели года (понедельник как первый день недели) как десятичное число (01-53)
    W: Возвращает номер недели года (понедельник как первый день недели) как десятичное число (00-53)
    X: Возвращает национальное представление времени
    "Y": Возвращает год с столетием как десятичное число
    Z: Возвращает значение часового пояса
    a: Возвращает сокращенное название национального дня недели
    b: Возвращает сокращенное значение национального месяца
    c: Возвращает национальное представление времени и даты
    d: Возвращает день месяца как десятичное число (01-31)
    e: Возвращает день месяца как десятичное число (1-31)
    j: Возвращает день года как десятичное число (001-366)
    k: Возвращает час (24-часовые часы) как десятичное число (0-23)
    l: Возвращает час (12-часовые часы) как десятичное число (1-12)
    label: Форматирование даты и времени
    m: Возвращает месяц как десятичное число (01-12)
    "n": |-
      Возвращает новую строку (
      )
    p: Возвращает национальное представление "до полудня" (a.m.) или "после полудня" (p.m.)
    percent: Возвращает %
    r: Эквивалент %I:%M:%S/%p
    t: Возвращает tab
    u: Возвращает день недели (понедельник как первый день недели) в виде десятичного числа (1-7)
    v: Эквивалент %e/%b/%Y
    w: Возвращает день недели (воскресенье как первый день недели) в виде десятичного числа (0-6)
    x: Возвращает национальное представление даты
    "y": Возвращает год без века в виде десятичного числа (00-99)
    z: Возвращает смещение часового пояса UTC
  string:
    E: Возвращает число с плавающей запятой в экспоненциальном представлении; upper-case Е
    O: Возвращает число base 8 с префиксом 0o
    X: Возвращает число base 16; upper-case A-F
    b: Возвращает число base 2 (в двоичном формате)
    binary: Возвращает число с плавающей запятой в экспоненциальном представлении с двоичным показателем
    d: Возвращает число base 10
    e: Возвращает число с плавающей запятой в экспоненциальном представлении; lower-case е
    f: Возвращает число с плавающей запятой с десятичной точкой
    label: Форматирование строки
    o: Возвращает число base 8
    t: Возвращает логическое значение как true/false
    v: Возвращает необработанное значение
    x: Возвращает число base  16; lower-case a-f
