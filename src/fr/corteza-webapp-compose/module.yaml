      connection:
        label: Connexion à une base de données
        placeholder: Sélectionnez une connexion de base de données
        description: Changer la connexion réinitialisera le niveau de sensibilité du module et des champs s'ils ne sont plus compatibles avec la nouvelle connexion
      ident:
        label: Nom de la collection ou de la table de base de données
        placeholder: compose_record
        description: "Nom de la table ou de la collection de base de données ou les éléments sont accessibles et stockés. Prend en charge les variables de partitionnement : {{module}} pour l'identifiant du module et {{namespace}} pour l'identifiant du namespace"
      connections:
        fetch-failed: Impossible de récupérer les connexions disponibles
      module-fields:
        label: Mappage et encodage des champs du module
        description: |
          Configurez la manière dont les champs d'enregistrement sont stockés et lus depuis la base de données.
          Le comportement par défaut et d'encoder les valeurs dans un JSON et les stocker dans un seul champ.
          Autrement, vous pouvez utiliser des colonnes portant le même nom que le champ (Colonne),
          ou utiliser un Alias et stocker la valeur directement dans la colonne.
      system-fields:
        label: Mappage et encodage des champs système
        description: |
          Les champs systèmes sont utilisés pour stocker les métadonnées d'un élément.
          Configurez-les pour les ignorer ou les stocker dans une colonne du même nom (Colonne), une colonne différente (Alias) ou les encodez au format JSON.
        grouptypes:
          all: Tous
          partition: Partition
          userReference: Référence utilisateur
          timestamps: Horodatages
          extras: Compléments
      encoding-strategy:
        unavailable: indisponible
        ident:
          placeholder: Nom de champ ou de colonne de table de base de données
        strategies:
          plain:
            label: Colonne
          alias:
            label: Alias
          json:
            label: JSON
